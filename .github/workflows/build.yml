name: Build ESP32-C6 firmware

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: 4mb-noota
            flash: 4M
            partitions: partitions-4mb-noota.csv
            artifact_base: ESP32C6_ECU-4MB-noOTA
          - name: 8mb-ota
            flash: 8M
            partitions: partitions-8mb-ota.csv
            artifact_base: ESP32C6_ECU-8MB-OTA
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 platform
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.8
      - name: Install libraries
        run: |
          arduino-cli lib install "ArduinoJson@7.4.2" "PubSubClient@2.8" "NTPClient@3.2.1" "Time@1.6.1" "PSACrypto@1.1.1"
          mkdir -p "$HOME/Arduino/libraries"
          git clone --depth 1 https://github.com/ESP32Async/ESPAsyncWebServer.git "$HOME/Arduino/libraries/ESPAsyncWebServer"
          git clone --depth 1 https://github.com/ESP32Async/AsyncTCP.git "$HOME/Arduino/libraries/AsyncTCP"
          git clone --depth 1 https://github.com/sfrwmaker/sunMoon.git "$HOME/Arduino/libraries/sunMoon"
      - name: Select ${{ matrix.name }} layout
        run: cp "${{ matrix.partitions }}" partitions.csv
      - name: Compile ${{ matrix.name }}
        run: >-
          arduino-cli compile
          --fqbn esp32:esp32:esp32c6:FlashSize=${{ matrix.flash }},ZigbeeMode=zczr,PartitionScheme=custom,CDCOnBoot=cdc
          --output-dir dist/${{ matrix.name }}
          .
      - name: Package ${{ matrix.name }} artifacts
        shell: bash
        run: |
          set -euo pipefail
          source="dist/${{ matrix.name }}/ESP32C6-APsystems-ECU.ino"
          output="artifacts/${{ matrix.name }}"
          base="${{ matrix.artifact_base }}"
          mkdir -p "$output"
          cp "${source}.bin" "$output/${base}.bin"
          cp "${source}.merged.bin" "$output/${base}.merged.bin"
          cp "${source}.bootloader.bin" "$output/${base}.bootloader.bin"
          cp "${source}.partitions.bin" "$output/${base}.partitions.bin"
          if [[ "${{ matrix.name }}" == "8mb-ota" ]]; then
            cp "${source}.elf" "$output/${base}.elf"
          fi
          (cd "$output" && sha256sum * > SHA256SUMS.txt)
      - name: Upload ${{ matrix.name }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ESP32C6-APsystems-ECU-${{ matrix.name }}
          path: artifacts/${{ matrix.name }}/
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: compile
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download both firmware builds
        uses: actions/download-artifact@v4
        with:
          pattern: ESP32C6-APsystems-ECU-*
          path: release-inputs
      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          for directory in release-inputs/*; do
            name="$(basename "$directory")"
            (cd "$directory" && zip -q -r "$GITHUB_WORKSPACE/release-assets/${name}.zip" .)
          done
          find release-inputs -type f \( -name '*.bin' -o -name '*.elf' \) \
            -exec cp -t release-assets {} +
          (cd release-assets && sha256sum -- *.bin *.elf *.zip > SHA256SUMS.txt)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          release-assets/*
          --verify-tag
          --generate-notes
          --title "ESP32C6 APsystems ECU ${{ github.ref_name }}"
