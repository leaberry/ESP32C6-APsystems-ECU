name: Build ESP32-C6 firmware

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 platform
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.8
      - name: Install libraries
        run: |
          arduino-cli lib install "ArduinoJson@7.4.2" "PubSubClient@2.8" "NTPClient@3.2.1" "Time@1.6.1" "PSACrypto@1.1.1"
          mkdir -p "$HOME/Arduino/libraries"
          git clone --depth 1 https://github.com/ESP32Async/ESPAsyncWebServer.git "$HOME/Arduino/libraries/ESPAsyncWebServer"
          git clone --depth 1 https://github.com/ESP32Async/AsyncTCP.git "$HOME/Arduino/libraries/AsyncTCP"
          git clone --depth 1 https://github.com/sfrwmaker/sunMoon.git "$HOME/Arduino/libraries/sunMoon"
      - name: Compile
        run: >-
          arduino-cli compile
          --fqbn esp32:esp32:esp32c6:ZigbeeMode=zczr,PartitionScheme=custom,CDCOnBoot=cdc
          --export-binaries .
